name: Open Source Image Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the image to generate"
        required: true
        type: string
        default: "A tiny robot reading a book in a sunlit garden, watercolor illustration"
      seed:
        description: "Random seed for reproducible generation"
        required: true
        type: number
        default: 42

permissions:
  contents: read

jobs:
  generate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors

      - name: Generate image with Tiny-SD
        env:
          PROMPT: ${{ inputs.prompt }}
          SEED: ${{ inputs.seed }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import torch
          from diffusers import StableDiffusionPipeline

          model_id = "segmind/tiny-sd"
          prompt = os.environ["PROMPT"]
          seed = int(os.environ["SEED"])

          torch.set_num_threads(2)

          pipe = StableDiffusionPipeline.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
          )
          pipe.to("cpu")
          pipe.enable_attention_slicing()

          image = pipe(
              prompt=prompt,
              num_inference_steps=25,
              guidance_scale=7.5,
              generator=torch.Generator(device="cpu").manual_seed(seed),
          ).images[0]

          output = Path("generated-image.png")
          image.save(output)

          Path("generation-info.txt").write_text(
              f"Model: {model_id}\nSeed: {seed}\nPrompt: {prompt}\n",
              encoding="utf-8",
          )

          print(f"Saved {output}")
          PY

      - name: Upload generated image and metadata
        uses: actions/upload-artifact@v4
        with:
          name: atticfacts-generated-image
          path: |
            generated-image.png
            generation-info.txt
          if-no-files-found: error
          retention-days: 7
