
name: Tiny SLM Inference

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Text to send to the model"
        required: true
        type: string
        default: "Explain how a neural network learns in simple terms."

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Run SmolLM2 inference
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          python - <<'PY'
          import os
          import torch
          from pathlib import Path
          from transformers import AutoTokenizer, AutoModelForCausalLM

          MODEL = "HuggingFaceTB/SmolLM2-135M-Instruct"

          print("Loading model:", MODEL)

          tokenizer = AutoTokenizer.from_pretrained(MODEL)
          model = AutoModelForCausalLM.from_pretrained(
              MODEL,
              torch_dtype=torch.float32
          )

          model.eval()

          prompt = os.environ["PROMPT"]

          messages = [
              {"role": "user", "content": prompt}
          ]

          inputs = tokenizer.apply_chat_template(
              messages,
              add_generation_prompt=True,
              return_tensors="pt"
          )

          print("\nRunning inference...\n")

          with torch.inference_mode():
              outputs = model.generate(
                  inputs,
                  max_new_tokens=120,
                  do_sample=False,
                  pad_token_id=tokenizer.eos_token_id
              )

          response = tokenizer.decode(
              outputs[0][inputs.shape[-1]:],
              skip_special_tokens=True
          )

          Path("output.txt").write_text(response, encoding="utf-8")

          print("=" * 50)
          print("INPUT:", prompt)
          print("\nMODEL OUTPUT:")
          print(response)
          print("=" * 50)

          print("\nINFERENCE SUCCESSFUL")
          PY

      - name: Upload inference result
        uses: actions/upload-artifact@v4
        with:
          name: slm-inference-output
          path: output.txt
